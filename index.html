<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gifzo.lol - Be Animated | GIFs, Stickers, Clips & Visual Culture Stories</title>
  <meta name="description" content="Search, discover, share, and create animated GIFs, transparent stickers, and short clips on gifzo.lol. Explore in-depth stories on internet visual culture.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='30' fill='%2300ff99'/><text x='50%' y='68%' font-size='60' font-weight='900' text-anchor='middle' fill='%23121212'>G</text></svg>">
</head>
<body>

  <!-- Top Signature Rainbow Bar -->
  <div class="top-rainbow-bar"></div>

  <div class="app-container">

    <!-- Header & Navigation -->
    <header class="header">
      <div class="nav-top">
        <a href="#" id="logo-home-link" class="logo-container">
          <div class="logo-badge" title="gifzo.lol - Be Animated">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="gifzoLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#00ff99" />
                  <stop offset="33%" stop-color="#00ccff" />
                  <stop offset="66%" stop-color="#9933ff" />
                  <stop offset="100%" stop-color="#ff6699" />
                </linearGradient>
                <linearGradient id="gifzoInnerGrad" x1="100%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#fff35c" />
                  <stop offset="100%" stop-color="#ff6699" />
                </linearGradient>
              </defs>
              <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#gifzoLogoGrad)" />
              <rect x="13" y="13" width="74" height="74" rx="16" fill="#121212" />
              <path d="M 64 30 C 56 22 42 22 32 30 C 20 40 20 60 32 70 C 42 78 58 78 66 70 C 72 64 74 55 74 48 H 50 V 38 H 84 C 85 43 85 50 84 56 C 81 70 71 82 54 86 C 35 90 18 80 12 63 C 6 44 16 24 34 16 C 48 10 66 13 77 22 L 64 30 Z" fill="url(#gifzoInnerGrad)" />
              <path d="M42 38 L62 50 L42 62 Z" fill="#00ff99" />
            </svg>
          </div>
          <span class="logo-text">GIFZO<span class="logo-accent">.LOL</span></span>
        </a>
      </div>

      <!-- Main Search Bar -->
      <div class="search-wrapper">
        <div class="search-box">
          <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="Search all the GIFs, Stickers, Clips and Stories..." 
            autocomplete="off"
            aria-label="Search GIFs"
          />
          <button id="search-clear-btn" class="search-clear-btn" title="Clear Search">✕</button>
          <button id="search-btn" class="search-btn" title="Search">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </div>
        
        <!-- Autocomplete Suggestions Dropdown -->
        <div id="search-suggestions" class="search-suggestions"></div>
      </div>

      <!-- Trending Category Pills Bar -->
      <div id="trending-tags-bar" class="trending-tags-bar"></div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <div class="tabs-group">
        <button class="tab-btn active" data-tab="gifs">GIFs</button>
        <button class="tab-btn" data-tab="stickers">Stickers</button>
        <button class="tab-btn" data-tab="clips">Clips</button>
        <button class="tab-btn" data-tab="stories">
          Stories <span class="tab-badge">5 Articles</span>
        </button>
        <button class="tab-btn" data-tab="favorites">Favorites</button>
      </div>
    </nav>

    <!-- Main Content Section -->
    <main>
      <!-- Media Grid View (GIFs, Stickers, Clips, Favorites) -->
      <section id="media-view" class="view-section active">
        <div class="section-header">
          <h2 id="view-section-title" class="section-title">
            <svg viewBox="0 0 24 24"><path d="M16 6l1.41 1.41L13.83 11H20v2h-6.17l3.58 3.59L16 18l-6-6z"/></svg>
            Trending GIFs
          </h2>
        </div>
        <div id="media-masonry-grid" class="media-masonry-grid"></div>
      </section>

      <!-- Stories / Articles Section -->
      <section id="stories-view" class="view-section">
        <div class="section-header">
          <h2 class="section-title">
            📚 gifzo.lol Stories & Internet Visual Culture
          </h2>
        </div>
        
        <!-- Articles Cards Grid -->
        <div id="stories-grid" class="stories-grid"></div>

        <!-- Single Article Reader View -->
        <div id="article-reader-view" class="article-reader-view" style="display: none;"></div>
      </section>
    </main>

  </div>

  <!-- GIF Detail Lightbox Modal -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal-card">
      <button id="close-detail-modal" class="modal-close-btn" title="Close">✕</button>
      <div id="modal-card-body" style="display: contents;"></div>
    </div>
  </div>

  <!-- Upload / Create GIF Modal -->
  <div id="upload-modal-backdrop" class="modal-backdrop">
    <div class="modal-card" style="max-width: 580px; grid-template-columns: 1fr;">
      <button id="close-upload-modal" class="modal-close-btn" title="Close">✕</button>
      <div class="upload-modal-content">
        <h2 class="modal-title" style="color: var(--neon-cyan);">⚡ Create / Upload GIF</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Add a custom animated GIF URL to your local collection.</p>
        
        <form id="upload-form">
          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label" for="upload-title">GIF Title</label>
            <input type="text" id="upload-title" class="form-input" placeholder="e.g. Cyberpunk Cat Dance" required />
          </div>

          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label" for="upload-url">Image / GIF URL</label>
            <input type="url" id="upload-url" class="form-input" placeholder="https://media.giphy.com/media/..." required />
          </div>

          <div class="form-group" style="margin-bottom: 16px;">
            <label class="form-label" for="upload-category">Category</label>
            <select id="upload-category" class="form-input">
              <option value="Reactions">Reactions</option>
              <option value="Memes">Memes</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Gaming">Gaming</option>
              <option value="Anime">Anime</option>
              <option value="Artists">Artists</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label" for="upload-tags">Tags (Comma Separated)</label>
            <input type="text" id="upload-tags" class="form-input" placeholder="funny, cat, dance, cyber" />
          </div>

          <button type="submit" class="btn btn-gradient" style="width: 100%; justify-content: center; padding: 14px;">
            Publish GIF Loop
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Scripts -->
  <script src="articles.js"></script>
  <script src="app.js"></script>
</body>
</html>
